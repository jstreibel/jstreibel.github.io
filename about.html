<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About | João Streibel</title>
  <style>
    :root {
      --bg-deep: #062f43;
      --bg-ocean: #0a5f7a;
      --bg-emerald: #0f7f6f;
      --ink: #082638;
      --paper: #e8f8f2;
      --accent: #4f9d3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(140deg, var(--bg-deep) 4%, var(--bg-ocean) 48%, var(--bg-emerald) 100%);
      color: var(--ink);
      font-family: "Trebuchet MS", "Avenir Next", "Century Gothic", sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    main {
      width: min(760px, 100%);
      background: var(--paper);
      border: 2px solid rgba(10, 95, 122, 0.28);
      border-radius: 20px;
      padding: clamp(1.25rem, 3vw, 2.4rem);
      box-shadow: 0 20px 50px rgba(2, 33, 48, 0.32);
    }

    h1 {
      margin: 0 0 1rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.65;
    }

    a {
      color: var(--ink);
      font-weight: 700;
      text-decoration-thickness: 2px;
      text-underline-offset: 0.12em;
    }

    a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>About</h1>
    <p>
      I am a physicist and software developer focused on solving complex problems with practical,
      value-driven solutions.

      - a short background and what I care about.
    </p>
    <p>
      My approach combines curiosity, clear tradeoff analysis, and disciplined execution.
    </p>
    <p><a href="index.html">Back to home</a></p>
  </main>
</body>
</html>
